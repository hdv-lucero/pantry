# Development uses solid_cable, not Rails' generated `async`, for the reason the
# generated comment below spells out: async only reaches subscribers inside the
# broadcasting process. SuggestRecipesJob runs in the Solid Queue supervisor that
# Puma forks, so an async broadcast of a run's status (§4.2) would never arrive in
# the browser. Backed by its own database file (see database.yml).
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
