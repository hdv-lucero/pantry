# Local dev stack for Pantry. One service — no database service, no Redis.
# SQLite files live in storage/ on the bind mount, which is the whole point of
# the project (see design doc §2, §7). Production deploy is Kamal's Dockerfile,
# not this one.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bin/dev"
    environment:
      RAILS_ENV: development
      # The container must bind 0.0.0.0, not localhost, to be reachable from the host.
      BINDING: 0.0.0.0
      # Settled in Task 5: development now has its own queue database and names
      # the :solid_queue adapter (config/environments/development.rb), so Puma can
      # fork the supervisor and `docker compose up` stays a single command.
      SOLID_QUEUE_IN_PUMA: 1
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    tty: true
    stdin_open: true

volumes:
  bundle_cache:
