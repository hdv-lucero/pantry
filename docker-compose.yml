# Local dev stack for Pantry. One service — no database service, no Redis.
# SQLite files live in storage/ on the bind mount, which is the whole point of
# the project (see design doc §2, §7). Production deploy is Kamal's Dockerfile,
# not this one.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bin/dev"
    environment:
      RAILS_ENV: development
      # The container must bind 0.0.0.0, not localhost, to be reachable from the host.
      BINDING: 0.0.0.0
      # Off until Task 5: Rails 8's generated development config uses the :async
      # queue adapter against a single development.sqlite3 with no solid_queue
      # tables, so enabling this now starts a supervisor that dies on first query.
      # SOLID_QUEUE_IN_PUMA: 1
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    tty: true
    stdin_open: true

volumes:
  bundle_cache:
